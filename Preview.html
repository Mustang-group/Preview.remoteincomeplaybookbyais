<head>

<title>রিমোট ইনকাম ব্লুপ্রিন্ট (ফ্রি প্রিভিউ এডিশন) — Army IBA Specialist (AIS)</title>

<!-- Lucide Icons -->

<style>
  :root {
    --primary: #0284c7;
    --primary-dark: #0369a1;
    --accent: #10b981;
    --accent-dark: #047857;
    --warning: #f59e0b;
    --danger: #ef4444;
    --bg-surface: #ffffff;
    --bg-page: #070d19;
    --text-main: #0f172a;
    --text-muted: #475569;
    --border: #e2e8f0;
    --code-bg: #0b1329;
    --ais-gold: #fbbf24;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
    background-color: #f1f5f9;
    color: var(--text-main);
    line-height: 1.65;
    font-size: 14px;
    padding: 16px 8px;
  }

  .preview-wrapper {
    max-width: 760px;
    margin: 0 auto;
    background: var(--bg-surface);
    border-radius: 14px;
    box-shadow: 0 20px 40px -10px rgba(0,0,0,0.15);
    overflow: hidden;
    border: 1px solid var(--border);
  }

  /* AIS Header Bar */
  .brand-bar {
    background: #040914;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .brand-logo-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .brand-crest {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
    border: 1.5px solid var(--ais-gold);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
    color: #ffffff;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  .brand-text-name {
    font-size: 13.5px;
    font-weight: 700;
    color: #f8fafc;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }

  .brand-text-sub {
    font-size: 10px;
    color: var(--ais-gold);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 600;
    display: block;
  }

  .badge-free-preview {
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid rgba(16, 185, 129, 0.35);
    color: #34d399;
    padding: 3px 10px;
    border-radius: 9999px;
    font-size: 11px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
  }

  /* Hero Section */
  .hero {
    background: linear-gradient(145deg, #050b18 0%, #0c203d 60%, #051327 100%);
    color: #ffffff;
    padding: 40px 24px 34px;
    text-align: center;
    border-bottom: 4px solid var(--primary);
  }

  .hero h1 {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.35;
    margin-bottom: 10px;
    color: #f8fafc;
  }

  .hero p {
    font-size: 14.5px;
    color: #94a3b8;
    max-width: 620px;
    margin: 0 auto 18px;
  }

  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 12px;
    color: #cbd5e1;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 16px;
  }

  .hero-stats span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  /* Content Body */
  .preview-content {
    padding: 28px 24px;
  }

  @media (max-width: 600px) {
    .preview-content { padding: 20px 16px; }
    .hero { padding: 30px 16px; }
    .hero h1 { font-size: 21px; }
    .brand-bar { padding: 10px 16px; }
  }

  /* Interactive Live Decision Simulator */
  .simulator-box {
    background: linear-gradient(135deg, #091326 0%, #0f2444 100%);
    color: #ffffff;
    border: 1.5px solid var(--primary);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 26px;
  }

  .sim-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 700;
    color: #38bdf8;
    margin-bottom: 4px;
  }

  .sim-sub {
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 14px;
  }

  .sim-btn-group {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
    margin-bottom: 14px;
  }

  .sim-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.18);
    color: #f1f5f9;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    font-family: inherit;
  }

  .sim-btn:hover, .sim-btn.active {
    background: var(--primary);
    border-color: #38bdf8;
    font-weight: 600;
  }

  .sim-result-card {
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid #38bdf8;
    border-radius: 8px;
    padding: 14px;
    display: none;
    animation: fadeIn 0.3s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Teaser Section */
  .teaser-section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15.5px;
    font-weight: 700;
    margin: 22px 0 12px;
    border-bottom: 2px solid var(--border);
    padding-bottom: 6px;
  }

  .sample-box {
    background: var(--code-bg);
    color: #f8fafc;
    border-radius: 8px;
    padding: 16px;
    margin: 12px 0 20px;
    border: 1px solid #1e293b;
    position: relative;
  }

  .sample-badge {
    position: absolute;
    top: -9px;
    right: 12px;
    background: var(--accent-dark);
    color: #ffffff;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
  }

    font-size: 12px;
    color: #cbd5e1;
